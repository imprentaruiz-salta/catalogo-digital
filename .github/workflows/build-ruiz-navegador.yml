name: Build Ruiz Navegador Android
on:
  push:
    branches: [ruiz-navegador-build]
    paths:
      - 'ruiz-navegador-android.zip'
      - '.github/workflows/build-ruiz-navegador.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 emulator system-images;android-35;google_apis;x86_64'
      - name: Unpack app source
        run: unzip -q ruiz-navegador-android.zip -d .
      - name: Download Gradle and build
        run: |
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.13-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" --no-daemon --stacktrace :app:assembleDebug
      - name: Validate APK contents and signing
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          aapt dump badging "$APK" | grep -q "package: name='com.zapia.ruizbrowser2026'"
          apksigner verify --verbose "$APK"
          aapt dump permissions "$APK" | grep -q 'android.permission.RECORD_AUDIO'
          aapt dump permissions "$APK" | grep -q 'android.permission.CAMERA'
          unzip -Z1 "$APK" | grep -q 'lib/x86_64/libmozglue.so'
          unzip -Z1 "$APK" | grep -q 'lib/arm64-v8a/libmozglue.so'
          echo 'Native ABI entries:'
          unzip -Z1 "$APK" | grep -E '^lib/(x86_64|arm64-v8a)/' | sort -u | head -30
          echo 'Merged manifest and APK metadata validated.'
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ruiz-Navegador-Android15
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Boot emulator, install, launch and smoke-test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.zapia.ruizbrowser2026/com.zapia.ruizweb.MainActivity
            sleep 90
            adb shell dumpsys activity activities | grep -q 'com.zapia.ruizbrowser2026/com.zapia.ruizweb.MainActivity'
            adb logcat -d -t 6000 > "$RUNNER_TEMP/ruiz-logcat.txt"
            if grep -E 'FATAL EXCEPTION|Process: com.zapia.ruizbrowser2026, PID' "$RUNNER_TEMP/ruiz-logcat.txt"; then exit 1; fi
            adb shell uiautomator dump /sdcard/ruiz-window.xml >/dev/null
            adb pull /sdcard/ruiz-window.xml "$RUNNER_TEMP/ruiz-window.xml"
            if grep -q 'Listo' "$RUNNER_TEMP/ruiz-window.xml"; then echo 'Native UI reports page navigation completed.'; else echo 'Page load did not reach Listo before smoke-test timeout; app launch remained alive.'; fi
            adb shell screencap -p /sdcard/ruiz-screen.png
            adb pull /sdcard/ruiz-screen.png "$RUNNER_TEMP/ruiz-screen.png"
      - name: Upload emulator smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ruiz-Navegador-emulator-evidence
          path: |
            ${{ runner.temp }}/ruiz-window.xml
            ${{ runner.temp }}/ruiz-screen.png
            ${{ runner.temp }}/ruiz-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
