name: Build Ruiz Navegador Android
on:
  push:
    branches: [ruiz-navegador-build]
    paths:
      - 'ruiz-navegador-android.zip'
      - '.github/workflows/build-ruiz-navegador.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unpack app source
        run: unzip -q ruiz-navegador-android.zip -d .
      - name: Download Gradle and build
        run: |
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.13-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" --no-daemon --stacktrace :app:assembleDebug
      - name: Validate APK contents
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          aapt dump badging app/build/outputs/apk/debug/app-debug.apk | grep -q "package: name='com.zapia.ruizbrowser2026'"
          apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ruiz-Navegador-Android15
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
