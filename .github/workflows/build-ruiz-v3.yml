name: Build Ruiz Navegador Android v3
on:
  push:
    branches: [ruiz-navegador-build]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDKs
        run: sdkmanager --channel=3 'platforms;android-37.2' 'build-tools;37.0.0'
      - name: Unpack source
        run: unzip -q ruiz-navegador-android.zip -d .
      - name: Compile APK
        run: |
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-9.6.0/bin/gradle" --no-daemon :app:assembleDebug
      - name: Verify APK package and signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/37.0.0"
          test -s "$APK"
          "$BT/aapt" dump badging "$APK" | grep -q "package: name='com.zapia.ruizbrowser2026'"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump permissions "$APK" | grep -q 'android.permission.RECORD_AUDIO'
          unzip -Z1 "$APK" | grep -q 'lib/arm64-v8a/libmozglue.so'
      - uses: actions/upload-artifact@v4
        with:
          name: Ruiz-Navegador-Android15
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
