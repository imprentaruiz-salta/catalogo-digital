name: Build Lector Ruiz APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'LectorRuizAndroid-proyecto.zip'
      - '.github/workflows/build-lector-ruiz.yml'
permissions:
  contents: read
  actions: write
jobs:
name: Build Lector Ruiz APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'LectorRuizAndroid-proyecto.zip'
      - '.github/workflows/main.yml'
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-sdk-tools.zip
            mkdir -p /tmp/android-tools-unpack
            python3 -c "import zipfile; zipfile.ZipFile('/tmp/android-sdk-tools.zip').extractall('/tmp/android-tools-unpack')"
            mv /tmp/android-tools-unpack/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack application project
        run: python3 -c "import zipfile; zipfile.ZipFile('LectorRuizAndroid-proyecto.zip').extractall('.')"
      - name: Build installable debug APK
        run: gradle -p LectorRuizAndroid assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lector-ruiz-android-apk
          path: LectorRuizAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30  build:
