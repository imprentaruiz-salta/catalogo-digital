<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ 'Editar' if producto else 'Nuevo' }} Producto — Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;min-height:100vh}
header{background:linear-gradient(135deg,#128C7E,#25D366);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.2)}
header a{color:rgba(255,255,255,.85);text-decoration:none;font-size:22px}
header h1{font-size:17px;font-weight:800}
.form-card{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin:16px;padding:22px}
.form-group{margin-bottom:18px}
label{display:block;font-size:13px;font-weight:700;color:#374151;margin-bottom:6px}
input[type=text],input[type=number],select,textarea{width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:10px;font-size:15px;outline:none;transition:.2s;background:#fff}
input:focus,select:focus,textarea:focus{border-color:#25D366}
textarea{resize:vertical;min-height:80px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* FOTO */
.foto-preview{width:100%;height:160px;background:#f5f5f5;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:56px;margin-bottom:10px;overflow:hidden;border:2px dashed #e5e7eb}
.foto-preview img{width:100%;height:100%;object-fit:cover}
.btn-save{width:100%;background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;border:none;padding:16px;border-radius:50px;font-size:16px;font-weight:800;cursor:pointer;margin-top:8px}
.btn-save:hover{opacity:.9}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#f9fffe;border-radius:10px;border:2px solid #e5e7eb}
.toggle-label{font-size:14px;font-weight:700;color:#1a1a2e}
input[type=checkbox]{width:44px;height:24px;cursor:pointer;accent-color:#25D366}
</style>
</head>
<body>
<header>
  <a href="/admin">←</a>
  <h1>{{ '✏️ Editar' if producto else '➕ Nuevo' }} Producto</h1>
</header>

<form method="POST" enctype="multipart/form-data">
  <div class="form-card">

    <!-- Foto -->
    <div class="form-group">
      <label>📷 Foto del producto</label>
      <div class="foto-preview" id="fotoPreview">
        {% if producto and producto['foto'] %}
        <img src="/static/uploads/{{ producto['foto'] }}" id="fotoImg" alt="foto">
        {% else %}
        <span id="fotoEmoji">📦</span>
        {% endif %}
      </div>
      <input type="file" name="foto" accept="image/*" id="fotoInput" style="display:none" onchange="previewFoto(this)">
      <button type="button" onclick="document.getElementById('fotoInput').click()" style="width:100%;background:#f3f4f6;border:1px solid #e5e7eb;padding:10px;border-radius:50px;font-size:14px;cursor:pointer;font-weight:600">📷 Elegir foto</button>
    </div>

    <div class="row2">
      <div class="form-group">
        <label>Código *</label>
        <input type="text" name="codigo" value="{{ producto['codigo'] if producto else '' }}" required placeholder="BEB-001">
      </div>
      <div class="form-group">
        <label>Precio ($) *</label>
        <input type="number" name="precio" value="{{ producto['precio'] if producto else '' }}" required min="0" step="1" placeholder="1500">
      </div>
    </div>

    <div class="form-group">
      <label>Nombre del producto *</label>
      <input type="text" name="nombre" value="{{ producto['nombre'] if producto else '' }}" required placeholder="Coca-Cola 2.25L">
    </div>

    <div class="row2">
      <div class="form-group">
        <label>Categoría *</label>
        <select name="categoria" required>
          <option value="">Elegir...</option>
          {% for cat in categorias %}
          <option value="{{ cat }}" {{ 'selected' if producto and producto['categoria']==cat else '' }}>{{ cat }}</option>
          {% endfor %}
          <option value="__nueva__">+ Nueva categoría</option>
        </select>
      </div>
      <div class="form-group">
        <label>Marca *</label>
        <input type="text" name="marca" value="{{ producto['marca'] if producto else '' }}" required placeholder="Coca-Cola">
      </div>
    </div>

    <div class="form-group" id="nuevaCatGroup" style="display:none">
      <label>Nombre de nueva categoría</label>
      <input type="text" name="nueva_categoria" placeholder="Ej: Lácteos">
    </div>

    <div class="form-group">
      <label>Descripción</label>
      <textarea name="descripcion" placeholder="Ej: Botella retornable 2.25 litros">{{ producto['desc_'] if producto else '' }}</textarea>
    </div>

    <div class="form-group">
      <div class="toggle-row">
        <span class="toggle-label">Stock disponible para la venta</span>
        <input type="checkbox" name="stock" {{ 'checked' if not producto or producto['stock'] else '' }}>
      </div>
    </div>

    <div class="form-group">
      <div class="toggle-row">
        <span class="toggle-label">Producto activo (visible en catálogo)</span>
        <input type="checkbox" name="activo" {{ 'checked' if not producto or producto['activo'] else '' }}>
      </div>
    </div>

    <button class="btn-save" type="submit">💾 Guardar producto</button>
  </div>
</form>

<script>
function previewFoto(input) {
  if (!input.files || !input.files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var prev = document.getElementById('fotoPreview');
    prev.innerHTML = '<img src="' + e.target.result + '" style="width:100%;height:100%;object-fit:cover">';
  };
  reader.readAsDataURL(input.files[0]);
}
document.querySelector('select[name="categoria"]').addEventListener('change', function(){
  document.getElementById('nuevaCatGroup').style.display = this.value === '__nueva__' ? 'block' : 'none';
});
</script>
</body>
</html>
