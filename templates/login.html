<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Admin Catálogo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#128C7E,#25D366);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:20px;padding:36px 28px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.logo{text-align:center;margin-bottom:28px}
.logo .icon{font-size:48px;display:block;margin-bottom:8px}
.logo h1{font-size:22px;font-weight:800;color:#1a1a2e}
.logo p{font-size:13px;color:#6b7280;margin-top:4px}
label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;margin-top:16px}
input{width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:10px;font-size:15px;outline:none;transition:.2s}
input:focus{border-color:#25D366}
.error{background:#fee2e2;color:#dc2626;padding:10px 14px;border-radius:10px;font-size:13px;margin-top:12px;font-weight:600}
button{width:100%;background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;border:none;padding:14px;border-radius:50px;font-size:16px;font-weight:800;cursor:pointer;margin-top:24px}
button:hover{opacity:.9}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <span class="icon">🔐</span>
    <h1>Panel Admin</h1>
    <p>Catálogo Digital</p>
  </div>
  <form method="POST">
    <label>Usuario</label>
    <input type="text" name="user" autocomplete="username" required>
    <label>Contraseña</label>
    <input type="password" name="pass" autocomplete="current-password" required>
    {% if error %}<div class="error">⚠️ {{ error }}</div>{% endif %}
    <button type="submit">Ingresar</button>
  </form>
</div>
</body>
</html>
